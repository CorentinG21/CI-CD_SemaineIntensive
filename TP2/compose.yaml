services:
  api:
    build: ./api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      retries: 5
    networks:
      - tp-net

  db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 5
    networks:
      - tp-net

  cache:
    image: redis:7
    networks:
      - tp-net

  proxy:
    image: nginx:1.27
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    networks:
      - tp-net

networks:
  tp-net:

volumes:
  pgdata:
