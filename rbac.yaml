apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: ggodon-dauvel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-role
  namespace: ggodon-dauvel
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-rolebinding
  namespace: ggodon-dauvel
subjects:
  - kind: ServiceAccount
    name: api-sa
    namespace: ggodon-dauvel
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: api-role